<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>OpenClaw Voice</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        html, body {
            height: 100%;
            height: 100dvh;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow: hidden;
            -webkit-tap-highlight-color: transparent;
        }

        .container {
            max-width: 600px;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            text-align: center;
            padding: 16px 20px env(safe-area-inset-bottom, 16px);
            overflow: hidden;
        }

        /* Header block: title then status stacked */
        .header-row {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            margin-bottom: 12px;
            flex-shrink: 0;
        }

        h1 {
            font-size: 2.2rem;
            font-weight: 700;
            background: linear-gradient(90deg, #ff6b35, #f7c94b);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            white-space: nowrap;
        }

        /* Mic permission banner */
        .mic-banner {
            background: rgba(255, 107, 53, 0.12);
            border: 1px solid rgba(255, 107, 53, 0.3);
            border-radius: 12px;
            padding: 16px 20px;
            margin-bottom: 24px;
            display: none;
        }
        .mic-banner.visible { display: block; }
        .mic-banner p { color: #ff6b35; font-weight: 500; font-size: 0.95rem; }
        .mic-banner button {
            margin-top: 10px;
            padding: 10px 28px;
            background: #ff6b35;
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
        }

        /* Voice button */
        .voice-button {
            width: 120px; height: 120px;
            border-radius: 50%;
            border: none;
            background: linear-gradient(135deg, #ff6b35 0%, #e55a2b 100%);
            color: white;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 10px 40px rgba(255, 107, 53, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 16px;
            flex-shrink: 0;
            -webkit-user-select: none;
            user-select: none;
        }
        .voice-button:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }
        .voice-button:hover:not(:disabled) {
            transform: scale(1.05);
            box-shadow: 0 15px 50px rgba(255, 107, 53, 0.4);
        }
        .voice-button:active:not(:disabled),
        .voice-button.listening {
            transform: scale(0.95);
            background: linear-gradient(135deg, #e55a2b 0%, #c44a22 100%);
        }
        .voice-button.listening { animation: pulse 1.5s infinite; }

        @keyframes pulse {
            0%, 100% { box-shadow: 0 10px 40px rgba(255, 107, 53, 0.3); }
            50% { box-shadow: 0 10px 60px rgba(255, 107, 53, 0.6); }
        }

        /* Status — sits below title */
        .status {
            font-size: 0.9rem;
            color: #888;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            min-height: 20px;
        }
        .status.active { color: #ff6b35; }
        .status.thinking { color: #ff6b35; font-weight: 600; }

        /* Continuous loop icon button */
        .loop-btn {
            width: auto;
            padding: 10px 14px;
            border: 1px solid #444;
            background: transparent;
            color: #888;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1.1rem;
            line-height: 1;
            transition: all 0.2s;
            flex-shrink: 0;
        }
        .loop-btn:hover { border-color: #ff6b35; color: #ff6b35; }
        .loop-btn.active {
            border-color: #ff6b35;
            color: #ff6b35;
            background: rgba(255, 107, 53, 0.12);
        }

        /* Spinner */
        .spinner {
            display: inline-block;
            width: 18px; height: 18px;
            border: 2px solid rgba(255, 107, 53, 0.3);
            border-top-color: #ff6b35;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* Transcript */
        .transcript-box {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 12px;
            text-align: left;
            flex: 1 1 0;
            min-height: 80px;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
        }
        .transcript-box h3 {
            font-size: 0.9rem; color: #666;
            margin-bottom: 10px; text-transform: uppercase; letter-spacing: 0.1em;
        }
        .transcript-box p { font-size: 1rem; line-height: 1.6; color: #ccc; margin-bottom: 6px; padding-bottom: 6px; border-bottom: 1px solid rgba(255,255,255,0.05); }
        .transcript-box p.user { color: #ff6b35; }
        .transcript-box p.assistant { color: #4fc3f7; }
        .transcript-box p.preview { color: #ff6b35; opacity: 0.6; font-style: italic; }
        .transcript-box code {
            background: rgba(255, 255, 255, 0.1);
            padding: 2px 6px; border-radius: 4px;
            font-family: 'SF Mono', Monaco, monospace; font-size: 0.9em;
        }
        .transcript-box a { color: #ff6b35; text-decoration: none; }

        /* Controls */
        .controls { display: flex; gap: 10px; justify-content: center; margin-top: 0; flex-shrink: 0; }
        .controls button {
            padding: 10px 20px;
            border: 1px solid #444;
            background: transparent;
            color: #888;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.2s;
        }
        .controls button:hover { border-color: #ff6b35; color: #ff6b35; }

        .error { color: #ff4444; margin-top: 8px; font-size: 0.85rem; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header-row">
            <h1>🦞 OpenClaw Voice</h1>
            <div class="status" id="status">Connecting...</div>
        </div>

        <div class="mic-banner" id="micBanner">
            <p>Microphone access is needed for voice chat.</p>
            <button id="micPermBtn">Allow Microphone</button>
        </div>

        <button class="voice-button" id="voiceBtn" disabled>
            Hold to Talk
        </button>

        <div class="transcript-box">
            <h3>Conversation</h3>
            <div id="transcript"></div>
        </div>

        <div class="controls">
            <button id="newChatBtn">New Chat</button>
            <button id="clearBtn">Clear History</button>
            <button class="loop-btn" id="loopBtn" title="Continuous mode" aria-label="Toggle continuous mode">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="17 1 21 5 17 9"/>
                    <path d="M3 11V9a4 4 0 0 1 4-4h14"/>
                    <polyline points="7 23 3 19 7 15"/>
                    <path d="M21 13v2a4 4 0 0 1-4 4H3"/>
                </svg>
            </button>
        </div>

        <p class="error" id="error"></p>
    </div>

<script>
// --- DOM refs ---
const voiceBtn    = document.getElementById('voiceBtn');
const statusEl    = document.getElementById('status');
const transcriptEl= document.getElementById('transcript');
const transcriptBox = document.querySelector('.transcript-box');
const errorEl     = document.getElementById('error');
const newChatBtn  = document.getElementById('newChatBtn');
const clearBtn    = document.getElementById('clearBtn');
const loopBtn     = document.getElementById('loopBtn');
const micBanner   = document.getElementById('micBanner');
const micPermBtn  = document.getElementById('micPermBtn');

// --- State ---
let ws = null;
let mediaStream = null;
let audioContext = null;
let audioSource = null;
let audioProcessor = null;
let isRecording = false;
let continuousMode = false;
// Tracks an explicit user-initiated stop in continuous mode so the auto-restart
// cycle in onAudioComplete does NOT re-arm listening behind the user's back.
// Cleared the next time the user manually starts (taps the mic).
let userPausedContinuous = false;
let currentResponseElement = null;
let streamingText = '';
let modelName = ''; // <- ADDED
let backgroundTaskPending = false;

function playTone() {
    // Intentionally disabled: use iPhone-native audio behavior only.
}

// Audio playback via a single persistent <audio> element.
// iOS Safari needs one user-gesture .play() to "warm" the element;
// after that, swapping src and calling .play() works without gestures.
const player = new Audio();
player.volume = 1;
let playerWarmedUp = false;

// Audio queue (sentence chunks arrive one at a time, play in order)
const aacQueue = [];
let aacPlaying = false;
let currentBlobUrl = null;
let needsPreroll = true;

// 250ms silent WAV (8kHz 8-bit mono) — played before the first real audio chunk
// each turn to wake up iOS audio hardware so the first word isn't clipped.
const SILENT_PREROLL_WAV = 'data:audio/wav;base64,UklGRvQHAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YdAHAACAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgA==';

// Browser-native STT
const SpeechRecognitionCtor = window.SpeechRecognition || window.webkitSpeechRecognition;
const useBrowserSTT = !!SpeechRecognitionCtor;
let recognition = null;
let localFinalTranscript = '';
let localInterimTranscript = '';
let previewElement = null;

// ========== Session / persistence ==========

function getSessionId() {
    let id = localStorage.getItem('openclaw_session_id') || '';
    if (!id) {
        id = (window.crypto && window.crypto.randomUUID)
            ? window.crypto.randomUUID()
            : `${Date.now()}-${Math.random().toString(16).slice(2)}`;
        localStorage.setItem('openclaw_session_id', id);
    }
    return id;
}

function transcriptKey() { return `openclaw_voice_transcript_${getSessionId()}`; }
function backgroundPendingKey() { return `openclaw_voice_background_pending_${getSessionId()}`; }
function persistTranscript() { try { localStorage.setItem(transcriptKey(), transcriptEl.innerHTML); } catch {} }
function restoreTranscript() { try { const h = localStorage.getItem(transcriptKey()); if (h) transcriptEl.innerHTML = h; } catch {} }
function persistBackgroundPending() {
    try {
        if (backgroundTaskPending) localStorage.setItem(backgroundPendingKey(), '1');
        else localStorage.removeItem(backgroundPendingKey());
    } catch {}
}
function restoreBackgroundPending() {
    try { backgroundTaskPending = localStorage.getItem(backgroundPendingKey()) === '1'; } catch {}
}
function setBackgroundTaskPending(value) {
    backgroundTaskPending = !!value;
    persistBackgroundPending();
}
function renderBackgroundPendingStatus() {
    setStatus("Researching in background — I'll speak when ready.", 'thinking');
}

// ========== Audio playback ==========

// "Warm up" the audio element on a user gesture so iOS allows future .play() calls.
function warmUpPlayer() {
    if (playerWarmedUp) return;
    const silentWav = 'data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEAQB8AAIA+AAACABAAZGF0YQAAAAA=';
    player.src = silentWav;
    player.play().then(() => { playerWarmedUp = true; }).catch(() => {});
}

function queueAAC(b64, mime) {
    aacQueue.push({ b64, mime: mime || 'audio/aac' });
    if (!aacPlaying) drainAACQueue();
}

function drainAACQueue() {
    if (aacQueue.length === 0) { aacPlaying = false; onAudioComplete(); return; }
    aacPlaying = true;
    setStatus('Speaking...', 'active');

    if (needsPreroll) {
        needsPreroll = false;
        player.onended = () => drainAACQueue();
        player.onerror = () => drainAACQueue();
        player.src = SILENT_PREROLL_WAV;
        player.play().catch(() => drainAACQueue());
        return;
    }

    const item = aacQueue.shift();
    if (!item) { aacPlaying = false; onAudioComplete(); return; }
    const b64 = item.b64;
    const mime = item.mime || 'audio/aac';
    if (currentBlobUrl) { URL.revokeObjectURL(currentBlobUrl); currentBlobUrl = null; }

    const raw = atob(b64);
    const bytes = new Uint8Array(raw.length);
    for (let i = 0; i < raw.length; i++) bytes[i] = raw.charCodeAt(i);
    const blob = new Blob([bytes], { type: mime });
    currentBlobUrl = URL.createObjectURL(blob);

    player.onended = () => drainAACQueue();
    player.onerror = () => { console.error('Audio play error'); drainAACQueue(); };
    player.src = currentBlobUrl;
    // For iOS first-word clipping: wait a tiny bit for the audio hardware to fully wake up
    setTimeout(() => {
        player.play().catch(() => drainAACQueue());
    }, 60);
}

function flushAACQueue() {
    aacQueue.length = 0;
    aacPlaying = false;
    needsPreroll = true;
    player.onended = null;
    player.onerror = null;
    try { player.pause(); player.removeAttribute('src'); } catch {}
    if (currentBlobUrl) { URL.revokeObjectURL(currentBlobUrl); currentBlobUrl = null; }
}

function onAudioComplete() {
    if (backgroundTaskPending) {
        renderBackgroundPendingStatus();
        return;
    }
    if (continuousMode) {
        if (userPausedContinuous) {
            setStatus('Paused — tap mic to resume', '');
            return;
        }
        setStatus('🎙️ Ready to listen...', 'active');
        setTimeout(() => {
            if (continuousMode && !isRecording && !userPausedContinuous) {
                startRecording(true);
            }
        }, 500);
    } else {
        setStatus('Ready');
    }
}

// ========== Status display ==========

function formatModelLabel(raw) {
    if (!raw) return '';
    // Extract the part after the last "/" (e.g. "google/gemini-2.5-pro" → "gemini-2.5-pro")
    const name = raw.includes('/') ? raw.split('/').pop() : raw;
    // Split on hyphens, title-case each word, rejoin with spaces
    // Keep numeric segments lowercase so "4-6" stays "4.6"-adjacent
    return name
        .split('-')
        .map(w => /^\d/.test(w) ? w : w.charAt(0).toUpperCase() + w.slice(1))
        .join(' ');
}

function setStatus(text, mode) {
    // Pre-emptively add model name to ready states.
    if (text.startsWith('Ready') && modelName) {
        text = `Ready (${modelName})`;
    }

    if (mode === 'thinking') {
        statusEl.className = 'status thinking';
        statusEl.innerHTML = `<span class="spinner"></span> ${escapeHtml(text || 'Thinking')}`;
    } else if (mode === 'active') {
        statusEl.className = 'status active';
        statusEl.textContent = text;
    } else {
        statusEl.className = 'status';
        statusEl.textContent = text;
    }
}

// ========== Transcript helpers ==========

function escapeHtml(t) { const d = document.createElement('div'); d.textContent = t; return d.innerHTML; }

function renderMarkdown(text) {
    // Strip <think>…</think> blocks and malformed/dangling think tags before display.
    text = text.replace(/<think>[\s\S]*?<\/think>/gi, '');
    text = text.replace(/<\/?think\b[^>]*>/gi, '');
    text = text.replace(/<think[^\n]*/gi, '');
    text = text.replace(/<\/think[^\n]*/gi, '');
    text = text.replace(/^\s*\|.*$/gm, '');
    // Escape HTML so stray < > don't get eaten by the browser.
    text = escapeHtml(text);
    return text
        .replace(/```[\s\S]*?```/g, '<code>code</code>')
        .replace(/`([^`]+)`/g, '<code>$1</code>')
        .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
        .replace(/\*([^*]+)\*/g, '<em>$1</em>')
        .replace(/^#{1,3}\s+(.+)$/gm, '<strong>$1</strong>')
        .replace(/\n/g, '<br>');
}

function addTranscript(speaker, text, cls) {
    const p = document.createElement('p');
    p.className = cls;
    const rendered = cls === 'assistant' ? renderMarkdown(text) : escapeHtml(text);
    p.innerHTML = `<strong>${speaker}:</strong> ${rendered}`;
    transcriptEl.prepend(p);
    transcriptBox.scrollTop = 0;
    persistTranscript();
}

function showPreview(text) {
    if (!text) return;
    if (!previewElement) {
        previewElement = document.createElement('p');
        previewElement.className = 'preview';
        transcriptEl.prepend(previewElement);
    }
    previewElement.innerHTML = `<strong>You:</strong> ${escapeHtml(text)}`;
    transcriptBox.scrollTop = 0;
}

function clearPreview() {
    if (previewElement) { previewElement.remove(); previewElement = null; }
}

function updateStreamingResponse(text) {
    if (!currentResponseElement) {
        currentResponseElement = document.createElement('p');
        currentResponseElement.className = 'assistant';
        transcriptEl.prepend(currentResponseElement);
    }
    currentResponseElement.innerHTML = `<strong>AI:</strong> ${renderMarkdown(text)}`;
    transcriptBox.scrollTop = 0;
    persistTranscript();
}

function beginAssistantTurn() {
    streamingText = '';
    currentResponseElement = null;
    flushAACQueue();
}

// ========== WebSocket ==========

function connect() {
    const protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
    const basePath = location.pathname.replace(/\/$/, '');
    const wsPath = basePath ? `${basePath}/ws` : '/ws';
    const params = new URLSearchParams();
    const sessionId = getSessionId();
    params.set('session_id', sessionId);
    const apiKey = new URLSearchParams(location.search).get('api_key') || localStorage.getItem('openclaw_api_key') || '';
    if (apiKey) params.set('api_key', apiKey);
    ws = new WebSocket(`${protocol}//${location.host}${wsPath}?${params}`);

    ws.onopen = () => {
        if (backgroundTaskPending) renderBackgroundPendingStatus();
        else if (mediaStream) setStatus('Ready');
        else setStatus('Ready — tap mic to start');
        errorEl.textContent = '';
    };
    ws.onclose = (e) => {
        if ([4001,4002,4003].includes(e.code)) {
            setStatus('❌ ' + (e.reason || 'Connection refused'));
        } else {
            if (backgroundTaskPending) {
                setStatus("Researching in background — reconnecting...", 'thinking');
            } else {
                setStatus('Disconnected — reconnecting...');
            }
            setTimeout(connect, 2000);
        }
    };
    ws.onerror = () => { errorEl.textContent = 'WebSocket error. Is the server running?'; };
    ws.onmessage = (e) => handleMessage(JSON.parse(e.data));
}

function handleMessage(msg) {
    switch (msg.type) {
        case 'session_info':
            modelName = formatModelLabel(msg.display_model || msg.model || '');
            if (backgroundTaskPending) renderBackgroundPendingStatus();
            else setStatus('Ready'); // Re-set status to update with model name
            break;
        case 'background_task_started':
            setBackgroundTaskPending(true);
            renderBackgroundPendingStatus();
            break;
        case 'background_task_finished':
            setBackgroundTaskPending(false);
            break;
        case 'listening_started':
            setStatus(continuousMode ? '🎙️ Listening (continuous)...' : '🎙️ Listening...', 'active');
            break;
        case 'listening_stopped':
            setStatus('Thinking...', 'thinking');
            break;
        case 'assistant_turn_start':
            beginAssistantTurn();
            break;
        case 'transcript':
            // Server echoes user text. If browser STT already rendered a bubble, skip it.
            if (!useBrowserSTT) addTranscript('You', msg.text, 'user');
            setStatus('Thinking...', 'thinking');
            beginAssistantTurn();
            break;
        case 'response_chunk':
            streamingText += msg.text;
            updateStreamingResponse(streamingText);
            break;
        case 'audio_aac':
            queueAAC(msg.data, msg.mime);
            break;
        case 'response_complete':
            if (currentResponseElement) {
                currentResponseElement.innerHTML = `<strong>AI:</strong> ${renderMarkdown(msg.text)}`;
            }
            persistTranscript();
            if (!aacPlaying && aacQueue.length === 0) onAudioComplete();
            break;
        case 'response_text':
            addTranscript('AI', msg.text, 'assistant');
            break;
        case 'pong':
            break;
    }
}

// ========== Microphone ==========

async function requestMic() {
    try {
        mediaStream = await navigator.mediaDevices.getUserMedia({
            audio: { sampleRate: 16000, channelCount: 1, echoCancellation: true, noiseSuppression: true }
        });
        micBanner.classList.remove('visible');
        voiceBtn.disabled = false;
        setStatus('Ready');
        warmUpPlayer();
        return true;
    } catch (err) {
        errorEl.textContent = `Mic access denied: ${err.message}`;
        return false;
    }
}

// ========== Browser STT ==========

function setupRecognition() {
    if (!useBrowserSTT) return;
    recognition = new SpeechRecognitionCtor();
    recognition.continuous = true;
    recognition.interimResults = true;
    recognition.lang = 'en-US';

    recognition.onresult = (event) => {
        if (!isRecording) return;
        let fin = '', interim = '';
        for (let i = 0; i < event.results.length; i++) {
            const t = event.results[i][0]?.transcript || '';
            if (event.results[i].isFinal) fin += t + ' ';
            else interim += t + ' ';
        }
        localFinalTranscript = fin.trim();
        localInterimTranscript = interim.trim();
        const preview = localFinalTranscript || localInterimTranscript;
        if (preview) showPreview(preview);
    };
    recognition.onerror = () => {};
    recognition.onend = () => {
        if (isRecording && recognition) { try { recognition.start(); } catch {} }
    };
}

// ========== Recording ==========

let lastSoundTime = 0;
let _fromContinuousRestart = false;
let heardSpeech = false;
let recordingStartedAt = 0;

async function startRecording(fromContinuousRestart) {
    if (isRecording) return;
    _fromContinuousRestart = !!fromContinuousRestart;
    if (!_fromContinuousRestart) {
        // User manually started listening — clear any prior explicit pause
        // so onAudioComplete is allowed to chain again in continuous mode.
        userPausedContinuous = false;
    }

    if (!mediaStream) {
        const ok = await requestMic();
        if (!ok) return;
    }

    warmUpPlayer();
    localFinalTranscript = '';
    localInterimTranscript = '';
    clearPreview();

    if (!audioContext || audioContext.state === 'closed') {
        audioContext = new AudioContext({ sampleRate: 16000 });
    }
    audioSource = audioContext.createMediaStreamSource(mediaStream);
    audioProcessor = audioContext.createScriptProcessor(4096, 1, 1);

    lastSoundTime = Date.now();
    recordingStartedAt = Date.now();
    heardSpeech = false;
    audioProcessor.onaudioprocess = (e) => {
        if (!isRecording) return;
        const data = e.inputBuffer.getChannelData(0);

        if (!useBrowserSTT && ws && ws.readyState === WebSocket.OPEN) {
            const bytes = new Uint8Array(data.buffer.slice(0));
            let bin = '';
            for (let i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
            ws.send(JSON.stringify({ type: 'audio', data: btoa(bin) }));
        }

        if (continuousMode) {
            const energy = data.reduce((s, v) => s + Math.abs(v), 0) / data.length;
            const now = Date.now();
            if (energy > 0.015) {
                lastSoundTime = now;
                heardSpeech = true;
            } else if (heardSpeech && now - lastSoundTime > 2000) {
                stopRecording();
            } else if (!heardSpeech && now - recordingStartedAt > 6000) {
                stopRecording();
            } else if (now - recordingStartedAt > 15000) {
                stopRecording();
            }
        }
    };

    audioSource.connect(audioProcessor);
    audioProcessor.connect(audioContext.destination);

    isRecording = true;
    voiceBtn.classList.add('listening');
    voiceBtn.textContent = '🎙️ Listening...';
    playTone();

    if (useBrowserSTT) {
        setupRecognition();
        if (recognition) try { recognition.start(); } catch {}
    } else if (ws && ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify({ type: 'start_listening' }));
    }
}

function stopRecording(playSignal = true, userInitiated = false) {
    if (!isRecording) return;
    isRecording = false;
    if (userInitiated && continuousMode) {
        // Break the continuous-mode auto-restart cycle. onAudioComplete will
        // see this flag and refuse to re-arm listening until the user taps
        // the mic again, even if a delayed TTS chunk finishes after the tap.
        userPausedContinuous = true;
    }
    voiceBtn.classList.remove('listening');
    voiceBtn.textContent = continuousMode ? 'Tap to Talk' : 'Hold to Talk';

    if (audioProcessor) { audioProcessor.disconnect(); audioProcessor = null; }
    if (audioSource) { audioSource.disconnect(); audioSource = null; }
    // Always release the record graph before playback. Keeping mic capture open
    // during TTS can force iOS into a lower "play+record" output route.
    if (audioContext) { audioContext.close(); audioContext = null; }
    if (recognition) {
        try { recognition.onend = null; } catch {}
        try { recognition.stop(); } catch {}
        recognition = null;
    }

    if (mediaStream) {
        mediaStream.getTracks().forEach(t => t.stop());
        mediaStream = null;
    }

    let hasSomethingToSend = false;
    if (ws && ws.readyState === WebSocket.OPEN) {
        if (useBrowserSTT) {
            const finalText = (localFinalTranscript || localInterimTranscript).trim();
            clearPreview();
            if (finalText) {
                hasSomethingToSend = true;
                addTranscript('You', finalText, 'user');
                beginAssistantTurn();
                setStatus('Thinking...', 'thinking');
                ws.send(JSON.stringify({ type: 'text_input', text: finalText }));
            } else {
                setStatus('Ready');
            }
        } else {
            hasSomethingToSend = true;
            setStatus('Thinking...', 'thinking');
            ws.send(JSON.stringify({ type: 'stop_listening' }));
        }
    }

    if (playSignal) playTone();
}

// ========== Event listeners ==========

// Mic permission button
micPermBtn.addEventListener('click', requestMic);

// Hold-to-talk (mouse) + click-to-toggle in continuous mode
let handledByTouch = false;
voiceBtn.addEventListener('mousedown', (e) => {
    if (handledByTouch) return;
    if (e.button !== 0) return;
    if (continuousMode) {
        if (isRecording) stopRecording(true, true);
        else startRecording();
        return;
    }
    startRecording();
});
voiceBtn.addEventListener('mouseup', () => {
    if (handledByTouch) return;
    if (!continuousMode) stopRecording(false);
});
voiceBtn.addEventListener('mouseleave', () => {
    if (handledByTouch) return;
    if (!continuousMode && isRecording) stopRecording(false);
});

// Hold-to-talk (touch — iOS) + tap-to-toggle in continuous mode
voiceBtn.addEventListener('touchstart', (e) => {
    e.preventDefault();
    handledByTouch = true;
    warmUpPlayer();
    if (continuousMode) {
        if (isRecording) stopRecording(true, true);
        else startRecording();
        return;
    }
    startRecording();
}, { passive: false });
voiceBtn.addEventListener('touchend', (e) => {
    e.preventDefault();
    if (!continuousMode) stopRecording(false);
    setTimeout(() => { handledByTouch = false; }, 120);
}, { passive: false });

// Spacebar
document.addEventListener('keydown', (e) => {
    if (e.code === 'Space' && !e.repeat && document.activeElement?.tagName !== 'INPUT') {
        e.preventDefault();
        if (isRecording) stopRecording(true, true);
        else startRecording();
    }
});

// Clear / New Chat
clearBtn.addEventListener('click', () => { transcriptEl.innerHTML = ''; persistTranscript(); });
newChatBtn.addEventListener('click', () => {
    try { localStorage.removeItem(backgroundPendingKey()); } catch {}
    backgroundTaskPending = false;
    try { localStorage.removeItem(transcriptKey()); } catch {}
    const newId = (window.crypto && window.crypto.randomUUID)
        ? window.crypto.randomUUID()
        : `${Date.now()}-${Math.random().toString(16).slice(2)}`;
    localStorage.setItem('openclaw_session_id', newId);
    if (isRecording) stopRecording(true, true);
    transcriptEl.innerHTML = '';
    streamingText = '';
    currentResponseElement = null;
    flushAACQueue();
    persistTranscript();
    try { if (ws) { ws.onclose = null; ws.close(); } } catch {}
    ws = null;
    connect();
});

// Continuous mode toggle (loop icon button)
loopBtn.addEventListener('click', () => {
    continuousMode = !continuousMode;
    userPausedContinuous = false;
    loopBtn.classList.toggle('active', continuousMode);
    voiceBtn.textContent = continuousMode ? 'Tap to Talk' : 'Hold to Talk';
    if (continuousMode) {
        playTone();
        setStatus('🎙️ Continuous mode — tap to start', 'active');
        if (!mediaStream) requestMic();
    } else {
        if (isRecording) stopRecording();
        else playTone();
        setStatus('Ready');
        if (audioContext && audioContext.state !== 'closed') {
            audioContext.close(); audioContext = null;
        }
        if (mediaStream && !isRecording) {
            mediaStream.getTracks().forEach(t => t.stop());
            mediaStream = null;
        }
    }
});

// ========== Init ==========

restoreTranscript();
restoreBackgroundPending();
connect();

// Request mic permission immediately — avoids the awkward first-tap dance.
(async () => {
    try {
        const perm = await navigator.permissions.query({ name: 'microphone' });
        if (perm.state === 'granted') {
            await requestMic();
        } else if (perm.state === 'prompt') {
            micBanner.classList.add('visible');
        }
        // If 'denied', they'll see the error when they tap the button.
    } catch {
        // permissions.query not supported (older iOS) — show banner
        micBanner.classList.add('visible');
    }
})();

// Keep WebSocket alive
setInterval(() => {
    if (ws && ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify({ type: 'ping' }));
}, 15000);
</script>
</body>
</html>
